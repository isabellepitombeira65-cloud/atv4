<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venda de Carros</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>AutoDrive</h1>
    <button id="toggle-theme">Modo Escuro</button>
  </header>

  <section class="hero">
    <h2>Encontre o seu carro de sonho</h2>
    <p>As melhores ofertas com garantia e máxima qualidade.</p>
    <a href="#catalogo" class="btn">Ver Catálogo</a>
  </section>

  <section id="catalogo" class="cars-grid">
    <div class="car-card">
      <h3>Carro Desportivo</h3>
      <p>Preço: € 35.000</p>
      <button class="btn">Comprar</button>
    </div>
    <div class="car-card">
      <h3>SUV Familiar</h3>
      <p>Preço: € 28.000</p>
      <button class="btn">Comprar</button>
    </div>
    <div class="car-card">
      <h3>Elétrico Urbano</h3>
      <p>Preço: € 22.000</p>
      <button class="btn">Comprar</button>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
